
name: generate-images

# Manual only. No schedule, push or pull-request triggers.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = plan only | init-ledger-only = initialize ledger | probe = one test image | story = generate story images"
        type: choice
        options:
          - dry-run
          - init-ledger-only
          - probe
          - story
        default: dry-run

      story_index:
        description: "Which story in data/stories.json (1-3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"

      max_scenes:
        description: "Scenes to generate (1-8)"
        type: string
        default: "6"

      initialize_ledger:
        description: "Enable ONLY for the first init-ledger-only run"
        type: boolean
        default: false

      assume_used_today:
        description: "Workers AI neurons already used today before ledger initialization"
        type: string
        default: "0"

      add_external_neurons:
        description: "Additional Workers AI neurons used today outside this workflow"
        type: string
        default: "0"

permissions:
  contents: write

# Prevent concurrent workflows from spending the same quota.
concurrency:
  group: cloudflare-neurons
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Offline self-test
        run: python scripts/generate_images.py --selftest

      - name: Generate images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          STORY_INDEX: ${{ inputs.story_index }}
          MAX_SCENES: ${{ inputs.max_scenes }}
          INIT_LEDGER: ${{ inputs.initialize_ledger }}
          ASSUME_USED: ${{ inputs.assume_used_today }}
          ADD_EXTERNAL: ${{ inputs.add_external_neurons }}

        run: |
          set -euo pipefail

          ARGS=(
            --mode "$MODE"
            --story-index "$STORY_INDEX"
            --max-scenes "$MAX_SCENES"
            --assume-used "$ASSUME_USED"
            --add-external "$ADD_EXTERNAL"
          )

          if [ "$INIT_LEDGER" = "true" ]; then
            ARGS+=(--init-ledger)
          fi

          python scripts/generate_images.py "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-output
          path: out/images/
          retention-days: 3
          if-no-files-found: warn
